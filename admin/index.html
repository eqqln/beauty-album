<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>美颜相册 · 美容院管理后台</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- ========== 登录 / 注册 ========== -->
<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">美</div>
      <div>
        <h1>美颜相册</h1>
        <p>美容院管理后台</p>
      </div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">登录</button>
      <button class="auth-tab" data-tab="signup">注册</button>
    </div>

    <form id="loginForm" class="auth-form">
      <label class="field">
        <span>邮箱</span>
        <input type="email" id="loginEmail" autocomplete="username" placeholder="you@example.com" required>
      </label>
      <label class="field">
        <span>密码</span>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="至少 6 位" required>
      </label>
      <div class="auth-msg" id="loginMsg"></div>
      <button class="btn primary block" type="submit" id="loginBtn">登录</button>
    </form>

    <form id="signupForm" class="auth-form" hidden>
      <label class="field">
        <span>邮箱</span>
        <input type="email" id="suEmail" autocomplete="username" placeholder="you@example.com" required>
      </label>
      <label class="field">
        <span>验证码</span>
        <div class="row-inline">
          <input type="text" id="suCode" inputmode="numeric" maxlength="6" placeholder="6 位数字">
          <button class="btn ghost" type="button" id="sendCodeBtn">获取验证码</button>
        </div>
      </label>
      <label class="field">
        <span>设置密码</span>
        <input type="password" id="suPassword" autocomplete="new-password" placeholder="至少 6 位" required>
      </label>
      <div class="auth-msg" id="suMsg"></div>
      <button class="btn primary block" type="submit" id="suBtn">注册并登录</button>
      <p class="auth-tip">第一个注册的账号自动成为店主管理员，后续注册的为员工账号。</p>
    </form>
  </div>
</div>

<!-- ========== 控制台 ========== -->
<div id="appView" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="logo sm">美</div>
      <div class="side-brand-text">
        <strong id="sideShopName">美颜相册</strong>
        <span>管理后台</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-user">
        <div class="avatar" id="userAvatar">A</div>
        <div class="side-user-text">
          <strong id="userEmail">—</strong>
          <span id="userRole">管理员</span>
        </div>
      </div>
      <button class="btn ghost block" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="菜单">☰</button>
      <div class="topbar-title">
        <h2 id="pageTitle">概览</h2>
        <p id="pageSub">今日经营情况</p>
      </div>
      <div class="topbar-actions">
        <button class="btn ghost" id="refreshBtn">刷新</button>
        <button class="btn primary" id="quickAddBtn">+ 新建</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="./js/config.js"></script>
<script src="./js/cloud.js"></script>
<script src="./js/schema.js"></script>
<script src="./js/crud.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
