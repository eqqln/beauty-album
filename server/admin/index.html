<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf9f7">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>美颜相册 · 美容院管理后台</title>
<link rel="icon" href="/dl/icon-57.png">
<link rel="stylesheet" href="/admin/css/app.css?v=20261112c">
</head>
<body>

<!-- ========== 登录 ========== -->
<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">美</div>
      <div>
        <h1 id="authShopName">美颜相册</h1>
        <p>美容院管理后台</p>
      </div>
    </div>

    <div class="auth-head">
      <h2 class="auth-title">登录后台</h2>
      <p class="auth-sub">管理会员、套餐、充值卡与经营数据</p>
    </div>

    <form id="loginForm" class="auth-form" novalidate>
      <label class="field">
        <span>账号</span>
        <input type="text" id="loginEmail" autocomplete="username" inputmode="email" placeholder="邮箱 / 姓名 / 手机号" required>
      </label>
      <label class="field">
        <span>密码</span>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="请输入登录密码" required>
      </label>
      <div class="auth-msg" id="loginMsg"></div>
      <button class="btn primary block lg" type="submit" id="loginBtn">登 录</button>
    </form>

    <div class="auth-foot">
      <span>还没有后台账号？</span>
      <a href="#register" id="toSignup">去注册</a>
    </div>
  </div>
</div>

<!-- ========== 注册（独立页面） ========== -->
<div id="signupView" class="auth-wrap" hidden>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">美</div>
      <div>
        <h1 id="authShopName2">美颜相册</h1>
        <p>美容院管理后台</p>
      </div>
    </div>

    <div class="auth-head">
      <h2 class="auth-title">创建后台账号</h2>
      <p class="auth-sub">第一个注册的账号自动成为店主，之后注册的员工需要邀请码</p>
    </div>

    <form id="signupForm" class="auth-form" novalidate>
      <label class="field">
        <span>邮箱</span>
        <input type="email" id="suEmail" autocomplete="username" placeholder="you@example.com" required>
      </label>
      <label class="field">
        <span>姓名 / 店铺名</span>
        <input type="text" id="suName" placeholder="如：王姐" autocomplete="organization">
      </label>
      <label class="field">
        <span>设置密码</span>
        <input type="password" id="suPassword" autocomplete="new-password" placeholder="至少 6 位" required>
      </label>
      <label class="field" id="inviteField" hidden>
        <span>邀请码</span>
        <input type="text" id="suInvite" placeholder="向店主索取邀请码">
      </label>
      <div class="auth-msg" id="suMsg"></div>
      <button class="btn primary block lg" type="submit" id="suBtn">注册并登录</button>
    </form>

    <div class="auth-foot">
      <span>已经有账号了？</span>
      <a href="#login" id="toLogin">返回登录</a>
    </div>
  </div>
</div>

<!-- ========== 控制台 ========== -->
<div id="appView" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="logo sm">美</div>
      <div class="side-brand-text">
        <strong id="sideShopName">美颜相册</strong>
        <span>管理后台</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-user">
        <div class="avatar" id="userAvatar">A</div>
        <div class="side-user-text">
          <strong id="userEmail">—</strong>
          <span id="userRole">管理员</span>
        </div>
      </div>
      <div class="side-foot-btns">
        <button class="btn ghost block sm" id="pwdBtn">修改密码</button>
        <button class="btn ghost block sm" id="logoutBtn">退出</button>
      </div>
      <div class="side-build" id="sideBuild">20261112c</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="菜单">☰</button>
      <div class="topbar-title">
        <h2 id="pageTitle">概览</h2>
        <p id="pageSub">今日经营情况</p>
      </div>
      <div class="topbar-actions">
        <div class="tenant-pick" id="tenantPickWrap" hidden>
          <span class="tenant-pick-label">当前板块</span>
          <select id="tenantPick" title="切换板块，所有列表只看这一个板块的数据"></select>
        </div>
        <a class="btn ghost" href="/" target="_blank">安装页</a>
        <button class="btn ghost" id="refreshBtn">刷新</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<noscript>
  <div style="position:fixed;inset:0;z-index:99999;background:#fff;color:#333;padding:40px;font:16px/1.8 -apple-system,'PingFang SC',sans-serif">
    浏览器把 JavaScript 关掉了，后台无法运行。请在浏览器设置里允许本网站运行 JavaScript 后刷新。
  </div>
</noscript>

<script>
/* 兜底：脚本加载/运行异常时，把原因直接显示在登录框里，避免“点了没反应” */
(function () {
  function say(t) {
    var el = document.getElementById('loginMsg');
    if (el) el.textContent = t;
  }
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName === 'SCRIPT') {
      say('脚本加载失败（' + (e.target.src || '') + '），请强制刷新 Ctrl+F5');
      return;
    }
    say('页面出错：' + ((e && e.message) || '未知错误') + '，请强制刷新 Ctrl+F5');
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    say('请求出错：' + ((r && r.message) || r || '未知错误'));
  });
  window.addEventListener('load', function () {
    if (typeof window.API !== 'object') {
      say('后台脚本没有加载成功，请按 Ctrl+F5 强制刷新，或换 Chrome / Edge 浏览器打开。');
    }
  });
})();
</script>

<script src="/admin/js/api.js?v=20261112c"></script>
<script src="/admin/js/schema.js?v=20261112c"></script>
<script src="/admin/js/ui.js?v=20261112c"></script>
<script src="/admin/js/crud.js?v=20261112c"></script>
<script src="/admin/js/app.js?v=20261112c"></script>
</body>
</html>
