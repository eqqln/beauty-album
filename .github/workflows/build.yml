name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    # 只改文档 / 服务端 / 工具时不用重新打 IPA，省一次 macOS 构建
    paths-ignore:
      - "**.md"
      - "server/**"
      - "tools/**"
      - "docs/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew update >/dev/null 2>&1 || true
          brew install xcodegen

      - name: Read app version
        id: ver
        run: |
          V=$(grep -m1 'MARKETING_VERSION:' project.yml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "本次构建版本：$V"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project BeautyAlbum.xcodeproj \
            -scheme BeautyAlbum \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package into IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/BeautyAlbum.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "构建产物不存在，列出目录："
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf Payload BeautyAlbum.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry BeautyAlbum.ipa Payload
          ls -lh BeautyAlbum.ipa
          echo "IPA_SIZE=$(du -h BeautyAlbum.ipa | cut -f1)" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeautyAlbum-ipa
          path: BeautyAlbum.ipa
          retention-days: 90

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: 美颜相册 v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: |
            ## 美颜相册 v${{ steps.ver.outputs.version }}

            未签名 IPA，需自行签名后安装。

            ### 本次新增
            - 注册系统与登录系统（手机号验证码注册、密码登录）
            - 套餐系统：浏览套餐、一键开通，后台可改内容与价格
            - 充值卡：后台批量生成卡号卡密，App 内输入卡号卡密直接充值
            - 钱包：余额、累计充值、积分，充值 / 消费 / 调整完整流水
            - 与后台管理端全量联动（会员、客户、相册、对比图、收款、导师、产品、代理）

            ### 安装方式
            - Sideloadly / AltStore / SideStore（需 Apple ID）
            - TrollStore（支持的系统可直接安装）
            - 自有开发者证书重签

            构建号：${{ github.run_number }}
          files: BeautyAlbum.ipa
          draft: false
          prerelease: false
